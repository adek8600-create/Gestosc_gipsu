<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gęstość gipsu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gęstość zawiesiny gipsu</title>
<style>
  :root { --green:#2e7d32; --bg:#e9ecef; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); font-family: system-ui, Arial, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header { background: var(--green); color: #fff; padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.15rem; }
  main { flex: 1; padding: 16px; max-width: 480px; width: 100%; margin: 0 auto; }
  label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: .95rem; }
  input {
    width: 100%; font-size: 1.1rem; padding: 12px; border: 1px solid #aaa;
    border-radius: 8px; background: #fff;
  }
  input:focus { outline: 2px solid var(--green); border-color: var(--green); }
  .row { display: flex; gap: 10px; margin-top: 20px; }
  button {
    flex: 1; font-size: 1.05rem; padding: 14px; border: 0; border-radius: 8px;
    cursor: pointer; color: #fff;
  }
  #calculateButton { background: var(--green); }
  #resetButton { background: #757575; }
  #result {
    margin-top: 20px; padding: 14px; border-radius: 8px; background: #fff176;
    font-weight: bold; font-size: 1.1rem; min-height: 3.2em;
  }
  #result.error { background: #ffcdd2; }
  footer { font-size: 11px; text-align: center; padding: 12px; color: #555; }
</style>
</head>
<body>
<header><h1>Kalkulator gęstości zawiesiny gipsu</h1></header>
<main>
  <form id="densityCalculator" novalidate>
    <label for="containerMass">Masa pojemnika (winklera) [g]</label>
    <input type="number" id="containerMass" step="any" inputmode="decimal" required>

    <label for="totalMass">Masa substancji + pojemnika [g]</label>
    <input type="number" id="totalMass" step="any" inputmode="decimal" required>

    <label for="containerVolume">Objętość pojemnika [ml]</label>
    <input type="number" id="containerVolume" step="any" inputmode="decimal" required>

    <div class="row">
      <button type="button" id="calculateButton">Oblicz</button>
      <button type="button" id="resetButton">Wyczyść</button>
    </div>
  </form>
  <p>Wynik obliczeń:</p>
  <div id="result" aria-live="polite"></div>
</main>
<footer>Strona stworzona przez Adriana Jankowskiego</footer>

<script>
  const $ = id => document.getElementById(id);

  function calculateDensity() {
    const result = $('result');
    const containerMass = parseFloat($('containerMass').value);
    const totalMass = parseFloat($('totalMass').value);
    const containerVolume = parseFloat($('containerVolume').value);

    result.classList.remove('error');

    if ([containerMass, totalMass, containerVolume].some(isNaN)) {
      result.classList.add('error');
      result.textContent = 'Uzupełnij wszystkie pola.';
      return;
    }
    if (containerVolume <= 0) {
      result.classList.add('error');
      result.textContent = 'Objętość musi być większa od zera.';
      return;
    }
    const substanceMass = totalMass - containerMass;
    if (substanceMass <= 0) {
      result.classList.add('error');
      result.textContent = 'Masa substancji z pojemnikiem musi być większa niż masa pojemnika.';
      return;
    }
    // g / ml = kg / l
    const density = substanceMass / containerVolume;
    result.textContent = 'Gęstość substancji wynosi: ' + density.toFixed(2) + ' kg/l';
  }

  $('calculateButton').addEventListener('click', calculateDensity);
  $('resetButton').addEventListener('click', () => {
    $('densityCalculator').reset();
    $('result').textContent = '';
    $('result').classList.remove('error');
  });
  document.querySelectorAll('input').forEach(i =>
    i.addEventListener('keydown', e => { if (e.key === 'Enter') calculateDensity(); }));

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
